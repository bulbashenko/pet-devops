<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Console — sensor-hub</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e222d; --line: #2a2f3a;
    --fg: #e6e8ee; --dim: #9aa3b2; --accent: #4f8cff; --ok: #38c172; --bad: #e3524a;
    --tag: #b98bff; --commit: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 24px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--commit); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(56,193,114,.15); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(227,82,74,.15); }
  .v { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .card small { color: var(--dim); }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--fg); padding: 7px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.live td { background: rgba(79,140,255,.07); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .badge.tag { background: rgba(185,139,255,.16); color: var(--tag); }
  .badge.commit { background: rgba(107,114,128,.2); color: var(--dim); }
  .ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; }
  .sha { font-family: ui-monospace, monospace; color: var(--dim); font-size: 12px; }
  .now { font-size: 11px; color: var(--ok); font-weight: 600; }
  .reg { font-size: 12px; margin-left: 2px; }
  .act { text-align: right; white-space: nowrap; }
  .rollback { color: var(--tag); }
  #log { display: none; margin-top: 20px; background: #0a0c11; border: 1px solid var(--line); border-radius: 10px; }
  #log .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #log .head .t { font-weight: 600; }
  #log pre { margin: 0; padding: 14px; max-height: 380px; overflow: auto;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  #log a { color: var(--accent); }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 20px; }
  .pill.run { background: rgba(79,140,255,.15); color: var(--accent); }
  .pill.ok { background: rgba(56,193,114,.15); color: var(--ok); }
  .pill.bad { background: rgba(227,82,74,.15); color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Release Console · sensor-hub</h1>
  <p>Cut a release of HEAD, then deploy or roll back between released versions — installed straight from Artifactory, no rebuild.</p>
</header>
<div class="wrap">
  <div class="card">
    <span id="dot" class="dot"></span>
    <div>
      <div>In production: <span id="serving" class="v">—</span></div>
      <small id="installed"></small>
    </div>
    <span class="spacer"></span>
    <button class="ghost" id="refresh">↻ Refresh</button>
  </div>

  <div class="card">
    <div>
      <div>Release the current tip &nbsp;<span id="headver" class="v">—</span></div>
      <small id="headsub"></small>
    </div>
    <span class="spacer"></span>
    <button class="primary" id="release">🏭 Release HEAD</button>
  </div>

  <table>
    <thead>
      <tr><th>Version</th><th>Commit</th><th>When</th><th class="act"></th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="4" class="sub">Loading…</td></tr></tbody>
  </table>
  <p class="sub" id="hint" style="margin-top:12px"></p>

  <div id="log">
    <div class="head">
      <span class="t">Log</span>
      <span id="status" class="pill run">running…</span>
      <a id="jlink" href="#" target="_blank" rel="noopener" hidden>open in Jenkins ↗</a>
      <span class="spacer"></span>
      <button class="ghost" id="closelog">Close</button>
    </div>
    <pre id="out"></pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = { versions: [], deployed: {}, artifactory: {}, head: {} };
let busy = false;

async function load() {
  const r = await fetch('/api/state');
  state = await r.json();
  render();
}

function published(ver) {
  return !!(state.artifactory && (state.artifactory.published || []).includes(ver));
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render() {
  const d = state.deployed || {};
  $('serving').textContent = d.serving || '—';
  $('dot').className = 'dot ' + (d.serving ? (d.healthy ? 'ok' : 'bad') : '');
  $('installed').textContent = d.installed
    ? (d.installed === d.serving ? 'dpkg agrees: ' + d.installed
        : '⚠ dpkg says ' + d.installed + ' — differs from what is serving')
    : 'target not reachable';

  const h = state.head || {};
  $('headver').textContent = h.version || '—';
  $('headsub').textContent = h.subject || '';
  const alreadyReleased = published(h.version);
  $('release').disabled = busy || !state.jenkins;
  $('release').textContent = alreadyReleased ? '🏭 Re-release HEAD' : '🏭 Release HEAD';

  const live = state.versions.find(v => v.version === d.serving);
  const liveTs = live ? live.ts : null;
  $('rows').innerHTML = state.versions.map((v) => {
    const isNow = v.version === d.serving;
    const older = liveTs !== null && v.ts < liveTs;
    const inReg = published(v.version);
    let cell;
    if (isNow) {
      cell = '<button disabled>Deployed</button>';
    } else if (!inReg) {
      cell = '<span class="sub">not released</span>';
    } else {
      const label = older ? '<span class="rollback">↩ Roll back</span>' : 'Deploy';
      cell = `<button data-ref="${v.sha}" data-ver="${escapeHtml(v.version)}" ${busy ? 'disabled' : ''}>${label}</button>`;
    }
    return `<tr class="${isNow ? 'live' : ''}">
      <td>
        <span class="badge ${v.kind}">${v.kind}</span>
        <span class="ver">${v.version}</span>
        ${inReg ? '<span class="reg" title="published to Artifactory">📦</span>' : ''}
        ${isNow ? '<span class="now">● live</span>' : ''}
        <div class="sub">${escapeHtml(v.subject)}</div>
      </td>
      <td class="sha">${v.sha}</td>
      <td class="sub">${v.date}</td>
      <td class="act">${cell}</td></tr>`;
  }).join('');

  document.querySelectorAll('#rows button[data-ref]').forEach(b =>
    b.onclick = () => deployFromRegistry(b.dataset.ref, b.dataset.ver));

  $('hint').textContent = state.artifactory && state.artifactory.enabled
    ? '📦 = published to Artifactory and deployable. To make a version deployable, release it.'
    : 'Artifactory is not configured — set secrets/jfrog.env and restart.';
}

async function stream(endpoint, statusInit) {
  busy = true; render();
  $('log').style.display = 'block';
  $('out').textContent = '';
  $('jlink').hidden = true;
  setStatus('run', statusInit);
  $('log').scrollIntoView({ behavior: 'smooth' });
  try {
    const resp = await fetch(endpoint);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let done = null;
    while (true) {
      const { value, done: end } = await reader.read();
      if (end) break;
      let chunk = dec.decode(value, { stream: true });
      if (chunk.includes('__RC_DONE_OK__')) { done = true; chunk = chunk.replace('__RC_DONE_OK__\n', ''); }
      if (chunk.includes('__RC_DONE_FAIL__')) { done = false; chunk = chunk.replace('__RC_DONE_FAIL__\n', ''); }
      const out = $('out');
      out.textContent += chunk;
      out.scrollTop = out.scrollHeight;
      const m = out.textContent.match(/https?:\/\/[^\s]*\/job\/[^\s]*?\/\d+\//);
      if (m) { $('jlink').href = m[0] + 'console'; $('jlink').hidden = false; }
    }
    setStatus(done ? 'ok' : 'bad', done ? '✓ done' : '✗ failed');
  } catch (e) {
    setStatus('bad', '✗ ' + e.message);
  } finally {
    busy = false;
    await load();
  }
}

function deployFromRegistry(ref, ver) {
  if (busy) return;
  if (!confirm(`Deploy ${ver} to the target from Artifactory?`)) return;
  stream('/api/deploy_artifactory?ref=' + encodeURIComponent(ref), 'deploying…');
}

$('release').onclick = () => {
  if (busy) return;
  const h = state.head || {};
  if (!confirm(`Cut a release of ${h.version} (build, test, publish, deploy)?`)) return;
  stream('/api/release', 'queued in Jenkins…');
};

function setStatus(cls, text) {
  const s = $('status');
  s.className = 'pill ' + cls;
  s.textContent = text;
}

$('refresh').onclick = load;
$('closelog').onclick = () => { $('log').style.display = 'none'; };
load();
setInterval(() => { if (!busy) load(); }, 15000);
</script>
</body>
</html>
