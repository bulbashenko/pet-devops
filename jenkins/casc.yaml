# Jenkins Configuration as Code.
#
# Everything a person would otherwise click together lives here: the admin user,
# the build agent, the credentials and the release job. Nothing is configured
# through the UI, so this file — not a backup of $JENKINS_HOME — is the source
# of truth. See docs/adr/0005-jenkins-as-code.md.

jenkins:
  systemMessage: |
    pet-devops release controller — configured entirely from jenkins/casc.yaml.
    Pull requests are gated by GitHub Actions; this controller cuts releases.

  # Local accounts only: this controller is meant to run on a laptop or inside a
  # private network, not to be exposed.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  # Read-only for anonymous visitors so the pipeline can be looked at without
  # logging in; everything else requires the admin account.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID:-admin}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "anonymous"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"

  # Builds belong on an agent. Keeping the controller at zero executors means a
  # runaway build cannot take the controller down with it.
  numExecutors: 0
  labelString: "controller"
  mode: EXCLUSIVE

  remotingSecurity:
    enabled: true
  slaveAgentPort: 50000

  nodes:
    - permanent:
        name: "ubuntu-build"
        labelString: "ubuntu-build linux"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Artifactory. Absent in a local run, which is fine: the pipeline
          # reports the publish stage as skipped instead of failing.
          - usernamePassword:
              scope: GLOBAL
              id: "artifactory"
              username: "${JFROG_USER:-unused}"
              password: "${JFROG_TOKEN:-unused}"
              description: "Artifactory identity token"
          - string:
              scope: GLOBAL
              id: "artifactory-url"
              secret: "${JFROG_URL:-}"
              description: "Artifactory base URL"
          - string:
              scope: GLOBAL
              id: "conan-remote-url"
              secret: "${CONAN_REMOTE_URL:-}"
              description: "Conan repository URL in Artifactory"
          # SSH key for the deploy target, generated by scripts/gen_keys.sh and
          # mounted into the controller.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-key"
              username: "deploy"
              description: "SSH key for the sensor-hub deploy target"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy_key}"

unclassified:
  location:
    url: "http://localhost:8081/"
    adminAddress: "pet-devops@example.invalid"
  timestamper:
    allPipelines: true

security:
  scriptApproval:
    approvedSignatures:
      - "method java.nio.file.Path toFile"

jobs:
  - script: |
      pipelineJob('sensor-hub-release') {
        description('''
          Full release pipeline: build, test, package, publish to Artifactory,
          deploy to the target host and smoke test it.

          Pull requests are not built here — GitHub Actions gates those.
        '''.stripIndent())

        logRotator {
          numToKeep(30)
          artifactNumToKeep(10)
        }

        parameters {
          choiceParam('DEPLOY_SOURCE', ['local', 'artifactory'],
                      'Install the .deb this run built, or the one published to Artifactory')
          booleanParam('SKIP_DEPLOY', false, 'Build and publish only')
        }

        definition {
          cpsScm {
            scm {
              git {
                remote {
                  // Defaults to the repository mounted into the containers, so
                  // the stack works with no network at all. Point it at the
                  // GitHub URL to build from origin instead.
                  url(System.getenv('PIPELINE_REPO_URL') ?: 'file:///workspace')
                }
                branch(System.getenv('PIPELINE_REPO_BRANCH') ?: 'main')
                extensions {
                  cloneOptions { shallow(false) }
                }
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
