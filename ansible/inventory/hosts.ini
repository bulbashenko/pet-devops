; The deploy target is the container the compose stack starts (see
; docker/compose.yaml). Point this at a real VM and nothing in the role changes.
;
; Connection details are deliberately incomplete here. scripts/deploy.sh
; supplies them with --extra-vars because they differ by caller:
;
;   developer on the host   127.0.0.1:2222, key file secrets/deploy_key
;   Jenkins agent           target-host:22, key held by ssh-agent
;
; Naming a key file here would break the Jenkins case: ssh would offer that one
; identity, fail to find it, and never fall back to the agent.

[sensor_hubs]
target-host

[sensor_hubs:vars]
ansible_host=127.0.0.1
ansible_port=2222
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
; The target is recreated on every `make up`, so its host key legitimately
; changes; verifying it would only train the operator to ignore the warning.
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
