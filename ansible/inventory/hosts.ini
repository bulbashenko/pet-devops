# The deploy target is the container the compose stack starts (see
# docker/compose.yaml). Point this at a real VM and nothing in the role changes.

; scripts/deploy.sh overrides ansible_host/ansible_port with --extra-vars: the
; same container is 127.0.0.1:2222 from the developer's machine and
; target-host:22 from the Jenkins agent that shares its network.
[sensor_hubs]
target-host ansible_host=127.0.0.1 ansible_port=2222

[sensor_hubs:vars]
ansible_user=deploy
ansible_ssh_private_key_file=../secrets/deploy_key
ansible_python_interpreter=/usr/bin/python3
; The target is recreated on every `make up`, so its host key legitimately
; changes; verifying it would only train the operator to ignore the warning.
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
