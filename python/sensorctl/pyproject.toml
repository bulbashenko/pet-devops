[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "sensorctl"
dynamic = ["version"]
description = "Command line client for the sensor-hub telemetry daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Albekov" }]
keywords = ["telemetry", "cli", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
sensorctl = "sensorctl.cli:run"

[project.urls]
Homepage = "https://github.com/bulbashenko/pet-devops"
Source = "https://github.com/bulbashenko/pet-devops"

# The wheel version comes from the same git tag the Conan package and the DEB
# use — see scripts/version.sh and docs/adr/0002-version-from-git-tag.md.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$" }

[tool.hatch.build.hooks.vcs]
version-file = "src/sensorctl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running sensor-hub container (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["sensorctl"]
